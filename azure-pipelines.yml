# ASP.NET Core (.NET Framework)
# Build and test ASP.NET Core projects targeting the full .NET Framework.

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  displayName: 'Restore NuGet Packages'
  inputs:
    restoreSolution: '$(solution)'

# STEP 1: PREPARE SONARCLOUD (Must be before Build)
- task: SonarCloudPrepare@4
  displayName: 'Prepare SonarCloud Analysis'
  inputs:
    SonarQube: 'SonarCloud'
    organization: 'test-org-sk'
    scannerMode: 'dotnet'
    projectKey: 'test-org-sk'
    projectName: 'Test Org SK'
    extraProperties: |
      sonar.cs.cobertura.reportsPaths=$(System.DefaultWorkingDirectory)/**/MyCoverage/coverage.cobertura.xml

# STEP 2: BUILD SOLUTION (Sonar Scanner attaches to MSBuild here)
- task: DotNetCoreCLI@2
  displayName: 'Build Solution'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration)'

# STEP 3: RUN TESTS & COVERAGE
- task: DotNetCoreCLI@2
  displayName: 'Run Unit Tests & Collect Coverage'
  inputs:
    command: 'test'
    projects: '**/testproject1.csproj'
    arguments: '--configuration $(buildConfiguration) /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:CoverletOutput=./MyCoverage/'
    publishTestResults: true

# STEP 4: PUBLISH COVERAGE TO AZURE DEVOPS
- task: PublishCodeCoverageResults@2
  displayName: 'Publish Code Coverage Result'
  inputs:
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/MyCoverage/coverage.cobertura.xml'

# STEP 5: RUN SONARCLOUD ANALYSIS
- task: SonarCloudAnalyze@4
  displayName: 'Run SonarCloud Analysis'
  inputs:
    jdkversion: 'JAVA_HOME'

# STEP 6: PUBLISH QUALITY GATE RESULT TO AZURE DEVOPS
- task: SonarCloudPublish@4
  displayName: 'Publish SonarCloud Quality Gate'
  inputs:
    pollingTimeoutSec: '300'